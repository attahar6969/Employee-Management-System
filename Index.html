<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><?= company ?> - Employee Management</title>
<style>
:root{--navy:#0f3d5e;--navy2:#165a8a;--bg:#f2f5f9;--line:#dbe3ec;--txt:#1f2d3a;--mut:#667788;--ok:#1b8a4b;--okb:#e4f5ea;--warn:#a86a00;--warnb:#fff3d6;--bad:#c0392b;--badb:#fdeaea;--gry:#6b7785;--gryb:#eceff3}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;color:var(--txt);background:var(--bg)}
button,input,select,textarea{font:inherit}
#boot{padding:40px;text-align:center;color:var(--mut)}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(120deg,#08233a 0%,#0f3d5e 50%,#1a6a9e 100%);color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;height:54px;box-shadow:0 4px 16px rgba(8,35,58,.35),inset 0 -3px 0 #e0a100}
.brand{font-weight:700;font-size:17px;flex:1;text-shadow:0 1px 3px rgba(0,0,0,.35)}.brand small{display:block;font-weight:400;font-size:11px;opacity:.8}
.who{display:flex;align-items:center;gap:10px;font-size:13px}
.who .nm{display:inline-flex;align-items:center;gap:8px;padding:5px 14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:20px;font-weight:600;letter-spacing:.3px}
.who .nm::before{content:"";width:8px;height:8px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 3px rgba(61,220,132,.25)}
.chip{background:linear-gradient(135deg,#f0b90b,#e0a100);color:#3a2900;padding:3px 11px;border-radius:12px;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.burger{display:none;background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
.lay{display:flex;min-height:calc(100vh - 54px)}
nav#nav{width:220px;background:#fff;border-right:1px solid var(--line);padding:10px 0;flex-shrink:0}
nav#nav a{display:block;padding:10px 18px;color:var(--txt);cursor:pointer;border-left:3px solid transparent}
nav#nav a:hover{background:var(--bg)}nav#nav a.on{background:#e8f0f8;border-left-color:var(--navy);color:var(--navy);font-weight:600}
nav#nav .sep{height:1px;background:var(--line);margin:8px 14px}
@media(min-width:761px){
  nav#nav{position:sticky;top:54px;align-self:flex-start;height:calc(100vh - 54px);overflow-y:auto}
}
main{flex:1;padding:20px;min-width:0}
h2{margin:0 0 14px;color:var(--navy);font-size:20px}h3{margin:0 0 10px;font-size:15px;color:var(--navy)}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:12px}.g5{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.stat{background:#fff;border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:8px;padding:12px 14px}
.stat b{display:block;font-size:24px;color:var(--navy)}.stat span{color:var(--mut);font-size:12px}
.stat.a{border-left-color:#e0a100}.stat.g{border-left-color:var(--ok)}.stat.r{border-left-color:var(--bad)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th{background:#eaf0f6;color:var(--navy);text-align:left;padding:8px 10px;white-space:nowrap}td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
tr:hover td{background:#fafcfe}.num{text-align:right}
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:600}
.b-PENDING{background:var(--warnb);color:var(--warn)}.b-APPROVED,.b-Active,.b-Paid{background:var(--okb);color:var(--ok)}.b-REJECTED,.b-Inactive{background:var(--badb);color:var(--bad)}.b-CANCELLED,.b-Pending,.b-Processed{background:var(--gryb);color:var(--gry)}
.btn{background:var(--navy);color:#fff;border:0;border-radius:5px;padding:9px 16px;cursor:pointer;font-weight:600}.btn:hover{background:var(--navy2)}
.btn.sm{padding:5px 10px;font-size:12px}.btn.ghost{background:transparent;border:1px solid currentColor;color:var(--navy)}.top{background:linear-gradient(120deg,#08233a,#0f3d5e 55%,#1a6a9e)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.gr{background:var(--gry)}.btn:disabled{opacity:.6;cursor:wait}
label.l{display:block;font-weight:600;margin:10px 0 4px;font-size:13px}.hint{color:var(--mut);font-size:12px;margin-top:3px}
input[type=text],input[type=password],input[type=email],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;padding:9px 10px;border:1px solid #b9c6d4;border-radius:5px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid #9cc4e4;border-color:var(--navy2)}input:disabled,select:disabled{background:#eef1f5}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}.bar>div{min-width:130px}
.msg{padding:9px 12px;border-radius:5px;margin:10px 0;font-size:13px}.msg.e{background:var(--badb);color:var(--bad)}.msg.o{background:var(--okb);color:var(--ok)}.msg.i{background:#e8f0f8;color:var(--navy)}.msg.w{background:var(--warnb);color:var(--warn)}
.login{min-height:100vh;display:flex}.lbrand{flex:1;background:linear-gradient(160deg,var(--navy),#0b2a43);color:#fff;padding:60px 48px;display:flex;flex-direction:column;justify-content:center}
.lbrand h1{margin:0 0 8px;font-size:30px}.lbrand p{opacity:.85;max-width:380px;line-height:1.5}
.lform{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;background:#fff}.lbox{width:100%;max-width:380px}
.tabs{display:flex;border-bottom:2px solid var(--line);margin-bottom:16px}.tabs a{flex:1;text-align:center;padding:10px;cursor:pointer;color:var(--mut);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-2px}.tabs a.on{color:var(--navy);border-bottom-color:var(--navy)}
.lnk{color:var(--navy2);cursor:pointer;font-size:13px;text-decoration:underline;background:none;border:0;padding:0}
.hb{display:flex;align-items:center;gap:8px;margin:5px 0}.hb span.t{width:110px;font-size:12px;color:var(--mut)}.hb i{display:block;height:14px;border-radius:3px;background:var(--navy2);min-width:2px}.hb em{font-style:normal;font-size:12px}
.cols{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:6px}.cols div.c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;text-align:center;font-size:10px;color:var(--mut)}
.cols div.c i{display:block;width:100%}.leg{font-size:12px;margin-top:6px}.leg i{display:inline-block;width:10px;height:10px;margin:0 4px 0 10px;border-radius:2px}
.cCL{background:#165a8a}.cSL{background:#e0a100}.cOTHER{background:#7d5ba6}
.pv{margin:10px 0;min-height:20px}.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13px}.kv b{color:var(--mut);font-weight:600}
#toast{position:fixed;right:16px;bottom:16px;z-index:99;display:flex;flex-direction:column;gap:8px}.tst{background:var(--ok);color:#fff;padding:11px 16px;border-radius:6px;box-shadow:0 3px 10px rgba(0,0,0,.2);max-width:360px}.tst.bad{background:var(--bad)}
.ov{position:fixed;inset:0;background:rgba(10,25,40,.55);z-index:60;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px}
.md{background:#fff;border-radius:8px;width:100%;max-width:760px;box-shadow:0 8px 30px rgba(0,0,0,.3)}.md.s{max-width:520px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);background:#f6f9fc;border-radius:8px 8px 0 0}.mh b{color:var(--navy);font-size:16px}.mb{padding:16px 18px}.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{background:none;border:0;font-size:22px;cursor:pointer;color:var(--mut)}.ld{padding:30px;text-align:center;color:var(--mut)}.mut{color:var(--mut)}.sec{border:1px dashed #c3cfdb;border-radius:6px;padding:8px 12px;margin-top:12px;background:#fbfcfe}
@media(max-width:760px){.burger{display:block}.who .nm{display:none}nav#nav{position:fixed;top:54px;left:-240px;bottom:0;z-index:30;transition:left .2s;width:230px}nav#nav.open{left:0;box-shadow:4px 0 14px rgba(0,0,0,.2)}main{padding:12px}.lbrand{display:none}.kv{grid-template-columns:1fr}}

.ecs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.ec{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff}
.ec-h{display:flex;align-items:center;gap:10px}
.av{width:42px;height:42px;border-radius:50%;background:#e8f0f8;color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.ec-n{flex:1;min-width:0}.ec-n b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ec-n small{color:var(--mut)}
.ec-t{text-align:center;background:var(--badb);color:var(--bad);border-radius:8px;padding:4px 12px}.ec-t b{display:block;font-size:22px;line-height:1.2}.ec-t span{font-size:10px}
.ec-s{margin:14px 0 6px;font-size:12px;color:var(--mut);font-weight:600}
.ec-g3,.ec-g2,.ec-g1{display:grid;gap:8px}.ec-g3{grid-template-columns:repeat(3,1fr)}.ec-g2{grid-template-columns:repeat(2,1fr)}.ec-g1{grid-template-columns:1fr}
.ec-x{border-radius:8px;padding:8px 4px;text-align:center;background:#f2f5f9}
.ec-x span{display:block;font-size:11px;color:var(--mut)}.ec-x b{font-size:18px;color:var(--txt)}
.ec-x small{display:block;font-size:11px;margin-top:2px;color:inherit}
.ec-x.rm small{color:var(--ok)}
.ec-x.cl{background:#e3eef8}.ec-x.cl span,.ec-x.cl b{color:#165a8a}
.ec-x.lp{background:var(--badb)}.ec-x.lp span,.ec-x.lp b{color:var(--bad)}
.ec-x.sl{background:var(--warnb)}.ec-x.sl span,.ec-x.sl b{color:var(--warn)}
.ec-x.rm{background:var(--okb)}.ec-x.rm span,.ec-x.rm b{color:var(--ok)}
.ec-x.ot{background:#efe7f7}.ec-x.ot span,.ec-x.ot b{color:#6a4a94}
.ec-na{background:var(--gryb);border:1px dashed #b9c6d4;border-radius:8px;padding:10px;text-align:center;color:var(--gry);font-size:13px}
.ec-b{display:flex;height:6px;border-radius:3px;overflow:hidden;background:#eceff3;margin-top:14px}.ec-b i{display:block;height:100%}


.mw{margin-bottom:16px}
.mw-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 14px}
.mw-sum div{background:#f2f5f9;border-radius:8px;padding:8px;text-align:center}
.mw-sum span{display:block;font-size:11px;color:var(--mut)}.mw-sum b{font-size:18px;color:var(--navy)}
.mw-r{display:flex;align-items:center;gap:12px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:#fff}
.mw-r.cur{border:2px solid var(--navy2);background:#e8f0f8}
.mw-r.mut{background:#f6f8fb;border-color:transparent}
.mw-m{width:44px;font-weight:700;font-size:14px;color:var(--navy)}
.mw-c{flex:1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.mw-ch{font-size:12px;padding:2px 9px;border-radius:10px;background:#eceff3;color:var(--gry)}
.mw-ch.cr{background:var(--okb);color:var(--ok)}.mw-ch.us{background:#e3eef8;color:#165a8a}
.mw-ch.lp{background:var(--badb);color:var(--bad)}.mw-ch.ad{background:var(--warnb);color:var(--warn)}
.mw-no{font-size:12px;color:#9aa7b4}
.mw-tag{font-size:11px;background:var(--navy2);color:#fff;padding:1px 9px;border-radius:10px}
.mw-cl{width:62px;text-align:right}.mw-cl span{display:block;font-size:10px;color:var(--mut)}.mw-cl b{font-size:18px;color:var(--navy)}
@media(max-width:760px){.mw-sum{grid-template-columns:repeat(2,1fr)}}
/* ===== MOBILE / TOUCH FIXES ===== */
#prog{position:fixed;top:0;left:0;right:0;height:3px;z-index:99;display:none;background:linear-gradient(90deg,#e0a100,#165a8a,#e0a100);background-size:200% 100%;animation:pg 1s linear infinite}
@keyframes pg{to{background-position:-200% 0}}
html{-webkit-text-size-adjust:100%}
button,a,[data-a],select,label,input{touch-action:manipulation;-webkit-tap-highlight-color:rgba(15,61,94,.15)}
[data-a]{cursor:pointer}
.btn{min-height:40px}
main > p{display:flex;flex-wrap:wrap;gap:10px}
.burger{min-width:44px;min-height:44px}
@media(max-width:760px){
  input,select,textarea{font-size:16px}
  .btn{min-height:44px}
  .btn.sm{min-height:38px;padding:7px 12px}
  nav#nav a{padding:14px 18px}
  .bar>div{flex:1 1 45%;min-width:0}
  .bar>div:last-child{flex-basis:100%}
  .row>*{min-width:100%}
  /* tables become cards */
  .stk table,.stk tbody,.stk tr,.stk td{display:block;width:100%}
  .stk tr:first-child{display:none}
  .stk tr{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;padding:6px 10px;background:#fff}
  .stk td{border:0;padding:4px 0;display:flex;gap:10px;justify-content:space-between;text-align:right}
  .stk td::before{content:attr(data-label);font-weight:600;color:var(--mut);text-align:left;flex:0 0 38%}
  .stk td[data-label=""]::before{display:none}
  .stk td[data-label=""]{justify-content:flex-end}
  .stk td:empty{display:none}
  .ov{padding:0}.md{border-radius:0;min-height:100%;max-width:100%!important}
}

/* ===== LOGIN BRANDING ===== */
.lgo{width:110px;height:110px;background:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:20px;flex-shrink:0}
.lgo img{width:100%;height:100%;object-fit:contain;display:block}
.lgo b{font-size:36px;color:var(--navy)}
.lfeat{list-style:none;margin:22px 0 0;padding:0}
.lfeat li{display:flex;gap:10px;align-items:center;margin:10px 0;font-size:14px;opacity:.92}
.lfeat span{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
@media(max-width:760px){
  body:has(.login){background:var(--bg)}
  .login{flex-direction:column}
  .login{min-height:100vh;min-height:100dvh}
  .lbrand{display:flex;flex:none;flex-direction:row;align-items:center;gap:14px;padding:22px 18px}
  .lbrand .lgo{width:64px;height:64px;margin:0;border-radius:12px}
  .lbrand h1{font-size:20px;margin:0}
  .lbrand p{font-size:12px;margin:4px 0 0;max-width:none;line-height:1.4}
  .lfeat{display:none}
  .lform{flex:1;align-items:center;justify-content:center;background:transparent;padding:20px 14px 90px;margin-top:0}
  .lbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
}

/* ===== COMPANY NAME FONT (normal) ===== */
.lbrand h1,.top .brand{
  font-family:"Segoe UI",Roboto,Arial,sans-serif;
  font-weight:700; color:#fff; letter-spacing:.3px;
}
.top .brand small{font-family:"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:1.6px;text-transform:uppercase;font-size:10px;color:#f0cf7a;opacity:1;margin-top:1px}

/* ===== LEAVE POLICY POPUP ===== */
.md.pol .mb{max-height:62vh;overflow:auto}
.md.pol .mf{justify-content:space-between;align-items:center}
.pol-c{margin:0;flex:1 1 auto;align-items:flex-start}
@media(max-width:760px){
  .md.pol{display:flex;flex-direction:column;height:100vh;height:100dvh}
  .md.pol .mb{flex:1 1 auto;max-height:none;min-height:0;-webkit-overflow-scrolling:touch}
  .md.pol .mf{flex-direction:column;align-items:stretch;gap:12px;padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
  .md.pol .mf .btn{width:100%}
}

/* ===== COLLAPSIBLE SECTIONS ===== */
.cs{padding:0;overflow:hidden}
.cs .ch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;cursor:pointer;user-select:none;-webkit-user-select:none}
.cs .ch h3{margin:0}
.cs .ar{font-size:20px;color:var(--mut);line-height:1;transition:transform .2s}
.cs.open .ar{transform:rotate(180deg)}
.cs .cbd{display:none;padding:14px 16px 16px;border-top:1px solid var(--line)}
.cs.open .cbd{display:block}
.cs .cbd .grid .card{margin-bottom:0}
/* ===== RUNNING MESSAGE (ON LEAVE TODAY) ===== */
.tick{display:flex;align-items:stretch;background:#0f3d5e;border-radius:8px;overflow:hidden;height:52px;margin:14px 0 16px}
.tick .tl{display:flex;align-items:center;gap:9px;background:#0b2a43;padding:0 16px;flex-shrink:0;border-right:3px solid #e0a100}
.tick .tl b{color:#fff;font-size:13px;font-weight:600;letter-spacing:.6px;white-space:nowrap}
.tick .dot{width:9px;height:9px;border-radius:50%;background:#3ddc84;animation:tkpulse 1.4s ease-in-out infinite}
@keyframes tkpulse{0%,100%{opacity:1}50%{opacity:.25}}
.tick .tm{flex:1;overflow:hidden;display:flex;align-items:center;white-space:nowrap}
.tick .in{display:inline-flex;align-items:center;gap:26px;padding-left:100%;animation:tkscroll 14s linear infinite}
.tick .tm:hover .in{animation-play-state:paused}
@keyframes tkscroll{to{transform:translateX(-100%)}}
.tick .pp{display:inline-flex;align-items:center;gap:9px}
.tick .av{width:28px;height:28px;border-radius:50%;background:#e8f0f8;color:#0f3d5e;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tick .nm{color:#fff;font-size:14px;font-weight:600}
.tick .ty{font-size:11px;background:#e0a100;color:#3a2900;padding:2px 9px;border-radius:10px;font-weight:600}
.tick .sp{color:#5d8bb0;font-size:16px}
.tick .ct{display:flex;align-items:center;gap:6px;padding:0 16px;background:#0b2a43;color:#fff;font-size:13px;flex-shrink:0}
.tick .ct b{background:#e0a100;color:#3a2900;border-radius:10px;padding:1px 9px}
.tick.none .tl{border-right-color:#3ddc84}
.tick.none .dot{animation:none}
.tick.none .ct b{background:#3ddc84;color:#06361a}
.tick .none-t{flex:1;display:flex;align-items:center;padding:0 16px;color:#fff;font-size:14px}
@media(max-width:760px){.tick .tl{padding:0 10px}.tick .tl b{font-size:11px}.tick .ct{display:none}}

/* numeric headers line up with their numbers */
th.num{text-align:right}
td.num,th.num{white-space:nowrap;padding-right:14px}
.md .mw{margin-bottom:14px}
.md td{vertical-align:middle}
/* centered data tables (Balances & Diwali Bonus) */
@media(min-width:761px){
  .cn th,.cn td{vertical-align:middle;text-align:center}
  .cn th:first-child,.cn td:first-child{text-align:left}
  .cn.bn th:nth-child(8),.cn.bn td:nth-child(8){text-align:left}   /* Remarks in Diwali table */
  .cn td{padding-top:12px;padding-bottom:12px}
  .cn td.num,.cn th.num{text-align:center;padding-right:10px}
  .cn .btn.sm{min-width:84px}
}
.ec-g4{display:grid;gap:8px;grid-template-columns:repeat(4,1fr)}
.ec-h .btn{flex-shrink:0}
.ec-m{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--mut)}
.ec-m b{color:var(--txt)}
/* Balances & Bonus rows (same look as monthly cards) */
.mw-n{display:flex;align-items:center;gap:10px;width:210px;flex-shrink:0;min-width:0}
.mw-n b{display:block;color:var(--navy)}.mw-n small{color:var(--mut)}
.mw-n .av{width:38px;height:38px;font-size:13px}
.mw-c.col{flex-direction:column;align-items:flex-start;gap:6px}
.mw-l{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mw-lb{width:26px;font-size:11px;font-weight:700;color:var(--mut)}
.mw-ch.bal{background:var(--okb);color:var(--ok);font-weight:700}
.mw-ch.am{background:var(--okb);color:var(--ok);font-weight:700}
.mw-ch.el{background:#e3eef8;color:#165a8a;font-weight:700}
.b-Pending{background:var(--warnb);color:var(--warn)}
@media(max-width:760px){.mw-r{flex-wrap:wrap}.mw-n{width:100%}}

/* Employees: corporate directory */

/* ===== MOBILE UI v3 (interactive) ===== */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes shim{to{background-position:-200% 0}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes fin{from{opacity:0}to{opacity:1}}
@keyframes tin{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes ping{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.6);opacity:0}}
@keyframes rgdraw{from{stroke-dashoffset:var(--c)}}
@keyframes spin2{to{transform:rotate(360deg)}}

/* toast */
.tst{display:flex;align-items:center;gap:10px;border-radius:12px;animation:tin .25s ease-out}
.tst::before{content:"\2713";width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.tst.bad::before{content:"!"}

/* skeleton */
.sk{border-radius:12px;background:linear-gradient(90deg,#e6ecf3 25%,#f3f6fa 37%,#e6ecf3 63%);background-size:200% 100%;animation:shim 1.2s linear infinite}
.sk-t{height:22px;width:45%;margin-bottom:14px}
.sk-r{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sk-r .sk{height:58px}
.sk-c{height:92px;margin-bottom:10px}

/* page entry */
.pgin>*{animation:rise .32s ease-out both}
.pgin>*:nth-child(2){animation-delay:.05s}.pgin>*:nth-child(3){animation-delay:.1s}
.pgin>*:nth-child(4){animation-delay:.15s}.pgin>*:nth-child(5){animation-delay:.2s}
.pgin>*:nth-child(n+6){animation-delay:.25s}

/* chips (all screens) */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chp{flex:0 0 auto;padding:8px 16px;border-radius:20px;background:#fff;border:1px solid var(--line);color:var(--mut);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.chp i{font-style:normal;opacity:.7;margin-left:6px;font-size:11px}
.chp.on{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 3px 10px rgba(15,61,94,.3)}

/* dashboard ring */
.dh-rgw{display:flex;flex-direction:column;align-items:center;cursor:pointer}
.dh-rg{width:64px;height:64px}
.dh-rgw small{font-size:10px;opacity:.85}
.rgc{animation:rgdraw 1s ease-out}

/* live search */
.lsr{display:block;width:100%;min-height:42px;border-radius:21px;padding:0 16px;border:1px solid #b9c6d4;margin:8px 0;background:#fff}
.ep-pn .lsr{width:calc(100% - 24px);margin:10px 12px}

/* punch hero (employee) */
.pk-h{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(135deg,#0f3d5e,#165a8a);color:#fff;border-radius:14px;padding:14px 16px;margin-bottom:12px}
.pk-c small{display:block;font-size:11.5px;opacity:.8}
.pk-c b{display:block;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.15;margin:2px 0 8px}
.pbtn{position:relative;width:104px;height:104px;border-radius:50%;border:0;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex-shrink:0;box-shadow:0 6px 18px rgba(0,0,0,.3);-webkit-tap-highlight-color:transparent}

.pbtn .pr{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(255,255,255,.85);opacity:0}

.pbtn:active:not(:disabled){transform:scale(.94)}

/* pull-to-refresh indicator, quick-action button */
#ptr{position:fixed;left:50%;top:calc(52px + env(safe-area-inset-top));width:40px;height:40px;margin-left:-20px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--navy);z-index:50;opacity:0;pointer-events:none;transform:translateY(-50px);transition:opacity .25s}

/* ---------- month + year picker (used by every month switcher) ---------- */
function mPick(act, ym, max) {
  var now = new Date(), cur = max || (now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2));
  var mx = ym > cur ? ym : cur, my = Number(mx.slice(0, 4)), mm = Number(mx.slice(5, 7));
  var y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7));
  var names = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var mo = names.map(function (n, i) {
    return '<option value="' + ('0' + (i + 1)).slice(-2) + '"' + (i + 1 === m ? ' selected' : '') + ((y === my && i + 1 > mm) ? ' disabled' : '') + '>' + n + '</option>';
  }).join('');
  var yo = '';
  for (var k = Math.min(2025, y); k <= my; k++) yo += '<option value="' + k + '"' + (k === y ? ' selected' : '') + '>' + k + '</option>';
  return '<div class="mp" data-act="' + act + '"><select data-ch="mpick" data-t="m" aria-label="Month">' + mo + '</select><select data-ch="mpick" data-t="y" aria-label="Year">' + yo + '</select></div>';
}

function monthCards(t, title, note, kind, year) {
  var now = new Date(), cur = year === now.getFullYear() ? now.getMonth() : -1;
  var lapsName = kind === 'CL' ? 'Lapsed' : 'Expired';
  var cr = 0, us = 0, lp = 0;
  t.forEach(function (r) { cr += r.credit; us += r.used; lp += r.lapsed; });
  function r2(n) { return Math.round(n * 100) / 100; }
  var bal = t[cur >= 0 ? cur : 11].closing;
  function chip(label, val, cls, sign) { return '<span class="mw-ch ' + cls + '">' + label + ' ' + (sign || '') + val + '</span>'; }
  var rows = t.map(function (r, i) {
    var any = r.opening || r.credit || r.used || r.lapsed || r.adjust;
    var chips = '';
    if (r.opening) chips += chip('Opening', r.opening, '');
    if (r.credit) chips += chip('Credited', r.credit, 'cr', '+');
    if (r.used) chips += chip('Used', r.used, 'us', '-');
    if (r.lapsed) chips += chip(lapsName, r.lapsed, 'lp', '-');
    if (r.adjust) chips += chip('Adjust', r.adjust, 'ad', r.adjust > 0 ? '+' : '');
    if (!any) chips = '<span class="mw-no">' + (cur >= 0 && i > cur ? 'Upcoming' : 'No activity') + '</span>';
    if (i === cur) chips = '<span class="mw-tag">This month</span>' + chips;
    return '<div class="mw-r' + (i === cur ? ' cur' : (!any ? ' mut' : '')) + '"><div class="mw-m">' + r.month + '</div><div class="mw-c">' + chips + '</div><div class="mw-cl"><span>Closing</span><b>' + r.closing + '</b></div></div>';
  }).join('');
  return '<div class="card mw"><h3>' + title + '</h3>' + (note ? '<div class="hint" style="margin:-6px 0 0">' + note + '</div>' : '') +
    '<div class="mw-sum"><div><span>Credited</span><b>' + r2(cr) + '</b></div><div><span>Used</span><b>' + r2(us) + '</b></div><div><span>' + lapsName + '</span><b>' + r2(lp) + '</b></div><div><span>' + (kind === 'CL' ? 'Balance now' : 'Remaining') + '</span><b>' + bal + '</b></div></div>' + rows + '</div>';
}
function lvCard(k, d, al) {

  var names = { CL: 'Casual leave', SL: 'Sick leave', OTHER: 'Other leave' };
  var tone = {
    CL: { bg: '#e3eef8', fg: '#165a8a', bar: '#165a8a', ab: 'CL' },
    SL: { bg: 'var(--warnb)', fg: 'var(--warn)', bar: '#e0a100', ab: 'SL' },
    OTHER: { bg: '#efe7f7', fg: '#6a4a94', bar: '#7d5ba6', ab: 'OL' }
  }[k];
  var on = al.indexOf(k) > -1 || (x.used > 0);
  if (!on) return '<div class="lv-na"><b>' + names[k] + '</b><small>Not assigned</small></div>';
  var sub, big, pct, meta;

    sub = esc((S.cfg && S.cfg.otherTreatment) || 'Unpaid') + ', no balance limit';

    '<div class="lv-n">' + big + '</div><div class="lv-bar"><i style="width:' + pct + '%;background:' + tone.bar + '"></i></div>' + meta + '</div>';

function attChip(dist, flag) {

  if (flag === 'Location unavailable') return '<span class="at-chip bad">&#9888; Location unavailable</span>';
  if (flag === 'Office location not set') return '<span class="at-chip gry">Office location not set</span>';
  if (flag === 'Weak GPS') return '<span class="at-chip warn">&#9888; Weak GPS' + (dist != null ? ' &middot; ' + dist + ' m' : '') + '</span>';
  if (flag === 'Near boundary') flag = '';

function attBoot(uid) {

  if (CAL.uid !== uid) { CAL.data = null; CAL.sel = ''; CAL.month = ''; CAL.uid = uid; AT.ph = {}; }
  if (AT.data) {
    var b = $('#attCard'); if (b) b.innerHTML = attCardHtml(AT.data);pkStart();
    if (AT.data.today.hasInPhoto) attThumb('IN', AT.data.date);
    if (AT.data.today.hasOutPhoto) attThumb('OUT', AT.data.date);
  }
  if (CAL.jump) attCalLoad(CAL.month);
  else {
    CAL.month = '';
    if (AT.cal) { CAL.data = AT.cal; CAL.month = AT.cal.month; calSelFix(AT.cal); calRender(); }
    else { var cb = $('#attCal'); if (cb) cb.innerHTML = '<div class="card"><div class="ld">Loading calendar...</div></div>'; }

/* one input for one field of the KE form */
function kfField(f, i) {
  var id = 'kf' + i, val = f.v, h, isNew = !S.kf.id;
  var lab = esc(f.label || f.h) + (f.req ? ' <span style="color:#c0392b">*</span>' : '');
  var typing = f.digits
    ? ' maxlength="' + f.digits + '" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,\'\').slice(0,' + f.digits + ')"'
    : (f.upper ? ' style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase()"' : '');
  if (f.end && isNew && !f.ro) {
    h = '<select id="' + id + '"><option value="">Not Applicable</option><option value="1">1 Year</option><option value="3">3 Years</option><option value="5">5 Years</option></select>';
  } else if (f.opts && f.opts.length && !f.ro) {
    var list = f.opts.map(function (o) { return [o, o]; }), other = false;
    if (f.freeList) {
      if (val && f.opts.indexOf(val) < 0) other = true;
      list.push(['__other__', 'Other']);
    } else if (val && f.opts.indexOf(val) < 0) list.unshift([val, val]);
    h = '<select id="' + id + '"' + (f.freeList ? ' data-ch="kfOth" data-i="' + i + '"' : '') + '>' +
      opts(list, other ? '__other__' : val, f.req ? '-- Select --' : '-- none --') + '</select>';
    if (f.freeList) h += '<input type="text" id="kfo' + i + '" placeholder="Specify" style="margin-top:6px;' + (other ? '' : 'display:none') + '" value="' + esc(other ? val : '') + '">';
  } else if (f.long) {
    h = '<textarea id="' + id + '" rows="2">' + esc(val) + '</textarea>';
  } else if (f.date && !f.ro) {
    h = '<input type="date" id="' + id + '" value="' + esc(ISO_RE.test(val) ? val : '') + '">';
  } else if (f.num) {
    h = '<input type="number" min="0" id="' + id + '" value="' + esc(val) + '">';
  } else {
    h = '<input type="text" id="' + id + '" value="' + esc(val) + '"' + (f.ro ? ' disabled' : '') + (f.ro && !val ? ' placeholder="Automatic"' : '') + typing + '>';
  }
  return '<div style="flex:1 1 ' + (f.long ? '100%' : '240px') + '">' + fld(lab, h) + '</div>';
}
CHG.kfOth = function (el) {
  var o = document.getElementById('kfo' + el.getAttribute('data-i'));
  if (o) o.style.display = el.value === '__other__' ? '' : 'none';
};
function kfRead(f) {
  var el = document.getElementById('kf' + f.i);
  if (!el) return null;
  var s = String(el.value).trim();
  if (f.freeList && s === '__other__') { var o = document.getElementById('kfo' + f.i); s = o ? String(o.value).trim() : ''; }
  if (f.end && !S.kf.id && !f.ro) {
    if (!s) return '';
    var j = S.kfJoin !== undefined ? document.getElementById('kf' + S.kfJoin) : null, jd = j ? String(j.value) : '';
    if (!ISO_RE.test(jd)) return '';
    var p = jd.split('-'), d = new Date(Number(p[0]) + Number(s), Number(p[1]) - 1, Number(p[2]));
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  return s;
}
function kfForm(r, id) {

  if (missing) { toast(missing + ' is required.', true); return; }
  if (id && !Object.keys(vals).length) { toast('No changes to save.'); return; }

function wageCard(w) {
  function inr(n) { return Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 }); }
  if (!w || w.empty) return '<div class="card"><h3>This month\'s wages</h3><div class="msg i">' + esc((w && w.message) || 'Not available right now.') + '</div></div>';
  if (!w.hasSalary) return '<div class="card"><h3>' + esc(w.monthLabel) + ' wages tracker</h3><div class="msg w">Your salary is not set up yet. Please contact Admin.</div></div>';
  var pct = Math.round(w.dayNo / w.daysInMonth * 100);
  return '<div class="card"><div class="at-top"><h3>' + esc(w.monthLabel) + ' wages tracker</h3><span class="at-date">Day ' + w.dayNo + ' of ' + w.daysInMonth + '</span></div>' +
    '<div class="pc-bar"><i style="width:' + pct + '%"></i></div>' +
    '<div class="bl-top" style="margin-top:12px">' +
    '<div><span>Monthly salary</span><b>&#8377;' + inr(w.salary) + '</b></div>' +
    '<div><span>Deducted so far</span><b>&#8377;' + inr(w.confirmedAmt + w.penTotal) + '</b></div>' +
    '<div><span>On hold</span><b>&#8377;' + inr(w.holdAmt) + '</b></div>' +
    '<div><span>Earned so far</span><b>&#8377;' + inr(w.projected) + '</b></div></div>' +
    '<div class="pc-m" style="margin-bottom:10px"><span class="pc-ch ok">Present <b>' + w.present + '</b></span>' +
    (w.paidLeave ? '<span class="pc-ch">Paid leave <b>' + w.paidLeave + '</b></span>' : '') +
    (w.absent ? '<span class="pc-ch lop">Absent <b>' + w.absent + '</b></span>' : '') +
    (w.otherLeave ? '<span class="pc-ch">Other leave <b>' + w.otherLeave + '</b></span>' : '') +
    (w.pending ? '<span class="pc-ch">Awaiting approval <b>' + w.pending + '</b></span>' : '') + '</div>' +
    (w.pending ? '<div class="msg w">' + w.pending + ' day(s) are waiting for Admin approval (&#8377;' + inr(w.holdAmt) + '). If not approved, your pay would be about &#8377;' + inr(w.ifHoldLost) + '.</div>' : '') +
    (w.bonus ? '<div class="msg o">Diwali bonus of &#8377;' + inr(w.bonus) + ' is included this month.</div>' : '') +
    '<div class="hint">Estimate only: it assumes you are present for the rest of the month. One day\'s pay is &#8377;' + inr(w.rate) + ' (salary / ' + w.base + '). The final payslip appears after the month ends.</div></div>';
}
PG.eslip = function () {
  var wt = E('wageTracker').catch(function (e) { if (e.code === 'AUTH') throw e; return { empty: true, message: e.message }; });
  return Promise.all([E('payslip', { month: EPM }), wt]).then(function (res) {
    var r = res[0], w = res[1];
    EPM = r.month;
    var last = (function () { var n = new Date(), p = new Date(n.getFullYear(), n.getMonth() - 1, 1); return p.getFullYear() + '-' + ('0' + (p.getMonth() + 1)).slice(-2); })();
    var nav = '<div class="pc-top"><h2 style="margin:0">Wages &amp; Payslips</h2></div>' + wageCard(w) +
      '<div class="pc-top"><h3 style="margin:0">Monthly payslip</h3><div class="cal-nav">' +
      '<button class="btn sm ghost" data-a="eslipGo" data-m="' + esc(r.prev) + '" aria-label="Previous month"' + (r.prev ? '' : ' disabled') + '>&lsaquo;</button>' + mPick('eslipGo', r.month, last) +
      '<button class="btn sm ghost" data-a="eslipGo" data-m="' + esc(r.next) + '" aria-label="Next month"' + (r.next ? '' : ' disabled') + '>&rsaquo;</button></div></div>';
    if (r.empty) { ESLIP = null; main(nav + '<div class="card"><div class="msg i">' + esc(r.message) + '</div></div>'); return; }
    ESLIP = r;
    main(nav + '<div class="card">' + r.html + '<p style="margin-top:14px"><button class="btn gr" data-a="eslipPrint">Print</button> <button class="btn" data-a="eslipPdf">Download PDF</button></p></div>');
  });
};
H.eslipGo = function (d) { if (!d.m) return; EPM = d.m; H.go({ p: 'eslip' }); };
H.eslipPrint = function () { if (!ESLIP) return; PSLIP = { html: ESLIP.html }; H.psPrint(); };
H.eslipPdf = function (d, b) {
  run(b, function () { return E('payslipPdf', { month: EPM }).then(function (r) { saveFile(r.name, r.mime, r.data); }); });
};
/* ---- Accountant: Salary Payments (employee side) ---- */
var SPM = '', SPR = null;
PG.salpay = function () {
  return E('payAccList', { month: SPM }).then(function (r) {
    SPM = r.month; SPR = r;
    function inr(n) { return n == null ? '-' : Number(n).toLocaleString('en-IN', { maximumFractionDigits: 2 }); }
    var last = (function () { var n = new Date(), p = new Date(n.getFullYear(), n.getMonth() - 1, 1); return p.getFullYear() + '-' + ('0' + (p.getMonth() + 1)).slice(-2); })();
    var nav = '<div class="pc-top"><h2 style="margin:0">Salary Payments</h2><div class="cal-nav">' +
      '<button class="btn sm ghost" data-a="spGo" data-m="' + esc(r.prev) + '" aria-label="Previous month"' + (r.prev ? '' : ' disabled') + '>&lsaquo;</button>' + mPick('spGo', r.month, last) +
      '<button class="btn sm ghost" data-a="spGo" data-m="' + esc(r.next) + '" aria-label="Next month"' + (r.next ? '' : ' disabled') + '>&rsaquo;</button></div></div>';
    var ready = r.rows.filter(function (x) { return x.ready && !x.paid; });
    var paidN = r.rows.filter(function (x) { return x.paid; }).length;
    function box(l, n) { return '<div><span>' + l + '</span><b>' + n + '</b></div>'; }
    var top = '<div class="bl-top">' + box('Employees', r.rows.length) + box('Paid', paidN) + box('To pay', ready.length) + box('Amount to pay', inr(sum_(ready, function (x) { return x.net; }))) + '</div>';
    var cards = r.rows.map(function (x) {
      var st, btn = '';
      if (x.paid) {
        st = '<span class="pc-ch ok">&#10003; Paid on <b>' + esc(x.paid) + '</b></span>' + (x.changed ? '<span class="pc-ch lop">Amount changed after payment (paid &#8377;' + inr(x.paidAmt) + ')</span>' : '');
        btn = '<button class="btn sm gr" data-a="spUndo" data-id="' + esc(x.empId) + '" data-n="' + esc(x.name) + '">Undo</button>';
      } else if (x.ready) {
        st = '<span class="pc-ch">Not paid</span>';
        btn = '<button class="btn sm ok" data-a="spPaid" data-id="' + esc(x.empId) + '" data-n="' + esc(x.name) + '" data-a2="' + esc(inr(x.net)) + '">Mark as Paid</button>';
      } else {
        st = '<span class="pc-ch lop">Not ready: ' + esc(x.why) + '</span>';
      }
      return '<div class="pc"><div class="pc-h"><div class="bc-av">' + esc(ini_(x.name)) + '</div><div class="bc-id"><b>' + esc(x.name) + '</b><small>' + esc(x.empId) + (x.dept ? ' &middot; ' + esc(x.dept) : '') + '</small></div>' +
        '<div class="pc-net"><small>Net pay</small><b>' + (x.net == null ? '-' : '&#8377;' + inr(x.net)) + '</b></div></div>' +
        '<div class="pc-m" style="margin-top:10px">' + st + '<span style="margin-left:auto">' + btn + '</span></div></div>';
    }).join('');
    main(nav + '<div class="msg i">Pay the employee from the bank, then tap <b>Mark as Paid</b>. Only finished months are shown. A slip is ready only when no day is waiting for Admin approval.</div>' + top +
      (ready.length ? '<p><button class="btn ok" data-a="spAll">Mark all ready as Paid (' + ready.length + ')</button></p>' : '') +
      '<div class="pc-list">' + (cards || '<div class="ld">No employees found.</div>') + '</div>');
  });
};
H.spGo = function (d) { if (!d.m) return; SPM = d.m; H.go({ p: 'salpay' }); };
function spSend(ids, undo, btn) {
  return run(btn, function () {
    return E('payAccMark', { month: SPM, ids: ids, undo: undo }).then(function (r) {
      toast(r.message);
      return PG.salpay();          // refresh the list in place, no skeleton flash
    });
  }, 'Saving...');
}
H.spPaid = function (d, b) {
  ask('Mark ' + d.n + ' as Paid (Rs ' + d.a2 + ')?', 'Yes, paid', 'ok').then(function (y) { if (y) spSend([d.id], false, b); });
};
H.spUndo = function (d, b) {
  ask('Remove the Paid mark of ' + d.n + '?', 'Yes, undo', 'bad').then(function (y) { if (y) spSend([d.id], true, b); });
};
H.spAll = function (d, b) {
  var ids = (SPR ? SPR.rows : []).filter(function (x) { return x.ready && !x.paid; }).map(function (x) { return x.empId; });
  if (!ids.length) return;
  ask('Mark ' + ids.length + ' employee(s) as Paid? Make sure all bank transfers are done.', 'Yes, all paid', 'ok').then(function (y) { if (y) spSend(ids, false, b); });
};

/* ---- company logo (Owner only) ---- */
function logoCard() {
  return '<div class="card" id="logoCard"><h3>Company logo</h3><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div class="lgo" style="width:90px;height:90px;margin:0;border:1px solid var(--line)">' + logoHtml() + '</div><div><div class="hint" style="margin-bottom:8px">' + (LOGO_URL ? 'Shown on the login page.' : 'No logo uploaded. A plain mark is shown instead.') + ' PNG, JPG or WEBP; it is resized automatically. Only the Owner admin can change it.</div><input type="file" id="logoFile" accept="image/png,image/jpeg,image/webp" data-ch="logoPick" style="display:none"><button class="btn" data-a="logoUp">' + (LOGO_URL ? 'Replace logo' : 'Upload logo') + '</button> ' + (LOGO_URL ? '<button class="btn gr" data-a="logoDel">Remove logo</button>' : '') + '</div></div></div>';
}
function logoRefresh() { var c = $('#logoCard'); if (c) c.outerHTML = logoCard(); }
H.logoUp = function () { $('#logoFile').click(); };
CHG.logoPick = function (el) {
  var f = el.files && el.files[0]; if (!f) return;
  if (!/^image\/(png|jpeg|webp)$/.test(f.type)) { toast('Please choose a PNG, JPG or WEBP image.', true); return; }
  var rd = new FileReader();
  rd.onload = function () {
    var im = new Image();
    im.onload = function () {
      var m = 256, k = Math.min(1, m / Math.max(im.width, im.height)), w = Math.max(1, Math.round(im.width * k)), h = Math.max(1, Math.round(im.height * k));
      var cv = document.createElement('canvas'); cv.width = w; cv.height = h; var cx = cv.getContext('2d'); cx.drawImage(im, 0, 0, w, h);
      var out = cv.toDataURL('image/png');
      if (out.length > 100000) { cx.globalCompositeOperation = 'destination-over'; cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); out = cv.toDataURL('image/jpeg', 0.85); }
      if (out.length > 100000) { toast('This image is too detailed. Please use a simpler or smaller logo.', true); return; }
      run(null, function () { return A('logoSave', { data: out }).then(function (r) { logoStore(r.ver, r.logo); toast(r.message); logoRefresh(); }); });
    };
    im.onerror = function () { toast('Could not read this image.', true); };
    im.src = rd.result;
  };
  rd.readAsDataURL(f);
};
H.logoDel = function () {
  ask('Remove the company logo?', 'Yes, remove', 'bad').then(function (y) {
    if (y) run(null, function () { return A('logoRemove', {}).then(function (r) { logoStore(r.ver, ''); toast(r.message); logoRefresh(); }); });
  });
};

/* ======================= ADMIN: settings ======================= */
function friendly(k) {
  return k.toLowerCase().split('_').map(function (w) {
    return /^(cl|sl|otp|ke|url|lat|lng|id)$/.test(w) ? w.toUpperCase() : w.charAt(0).toUpperCase() + w.slice(1);
  }).join(' ');
}
function ctl(it) {
  var id = 's_' + it.key, dis = (it.locked || it.type === 'readonly') ? ' disabled' : '', val = String(it.value), base = ' id="' + id + '" data-k="' + it.key + '" data-o="' + esc(val) + '"' + dis;
  if (it.type === 'bool') { var on = val.toUpperCase() === 'TRUE'; return '<select' + base + '><option value="TRUE"' + (on ? ' selected' : '') + '>Yes</option><option value="FALSE"' + (on ? '' : ' selected') + '>No</option></select>'; }
  if (it.type.indexOf('select:') === 0) return '<select' + base + '>' + opts(it.type.slice(7).split('|').map(function (x) { return [x, x]; }), val) + '</select>';
  if (it.type === 'number') return '<input type="number" step="any"' + base + ' value="' + esc(val) + '">';
  if (it.type === 'date') return '<input type="date"' + base + ' value="' + esc(val) + '">';
  if (it.type === 'time') return '<input type="time"' + base + ' value="' + esc(val) + '">';
  return '<input type="text"' + base + ' value="' + esc(val) + '">';
}
function ruleRows(br) {
  if (!br || br.restricted) return '';
  return '<div style="border-top:1px solid var(--line);padding:10px 0"><div class="row" style="align-items:center;margin-bottom:14px"><div style="flex:2"><b>Bonus rules</b><div class="hint">The rule marked "In use" is used when you press Calculate eligibility on the Diwali Bonus page. Press + to add your own rule.</div></div><div style="flex:1.4;text-align:right">' + (br.canEdit ? '<button class="btn sm" data-a="ruleForm">+ Add rule</button>' : '') + '</div></div><div class="rl">' +
    br.rules.map(function (r) {
      var on = r.id === br.active;
      var btns = br.canEdit ? (on ? '' : '<button class="btn sm ok" data-a="ruleUse" data-id="' + esc(r.id) + '">Use this</button>') +
        (r.locked ? '' : '<button class="btn sm gr" data-a="ruleForm" data-id="' + esc(r.id) + '">Edit</button>') +
        ((r.locked || on) ? '' : '<button class="btn sm bad" data-a="ruleDel" data-id="' + esc(r.id) + '">Delete</button>') : '';
      return '<div class="mw-r' + (on ? ' cur' : '') + '"><div class="mw-c col"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>' + esc(r.name) + '</b>' + (on ? '<span class="mw-tag">In use</span>' : '') + '</div><span class="hint">' + esc(r.desc) + '</span></div>' +
        (btns ? '<div class="rl-b">' + btns + '</div>' : '') + '</div>';
    }).join('') + '</div></div>';
}
PG.set = function () {
  return Promise.all([A('getSettings'), A('bonusRules')]).then(function (x) {
    var d = x[0], br = x[1], groups = [], by = {};
    S.brules = br;
    d.items.forEach(function (it) { if (!by[it.group]) { by[it.group] = []; groups.push(it.group); } by[it.group].push(it); });
    main('<h2>Settings</h2>' + logoCard() + '<div class="msg i">All company rules are managed here - no code changes needed. Changes take effect immediately and are recorded in the System Log.' + (d.canEditAccess ? '' : ' <b>Admin Access settings can be changed only by the Owner admin.</b>') + '</div><p><button class="btn" data-a="setSave">Save all changes</button> <button class="btn gr" data-a="runMaint">Run daily maintenance now</button> <button class="btn gr" data-a="remNow">Send pending reminder now</button></p>' +
      groups.map(function (g) {
        return '<div class="card"><h3>' + esc(g) + '</h3>' + by[g].map(function (it) { return '<div class="row" style="align-items:center;border-top:1px solid var(--line);padding:8px 0"><div style="flex:2"><b>' + esc(friendly(it.key)) + '</b><div class="hint">' + esc(it.desc) + '</div></div><div style="flex:1.4">' + ctl(it) + '</div></div>'; }).join('') + (g === 'Diwali Bonus' ? ruleRows(br) : '') + '</div>';
      }).join('') + '<p><button class="btn" data-a="setSave">Save all changes</button></p>');
  });
};
H.ruleForm = function (d) {
  var br = S.brules, r = d.id ? br.rules.filter(function (x) { return x.id === d.id; })[0] : { type: 'PCT_SALARY', value: '' };
  S.rid = d.id || '';
  modal(d.id ? 'Edit bonus rule' : 'Add bonus rule',
    fld('Rule name', '<input type="text" id="rn" maxlength="60" value="' + esc(r.name || '') + '" placeholder="e.g. 10% of salary">') +
    fld('Rule type', '<select id="rt">' + opts(br.types, r.type) + '</select>') +
    fld('Value', '<input type="number" step="any" min="0" id="rv" value="' + esc(r.value === 0 ? '' : r.value) + '">', 'Percent types: enter 10 for 10%. Days type: days of salary for each eligible CL. Flat types: amount in Rs. Manual ignores the value.'),
    '<button class="btn gr" data-a="mclose">Cancel</button><button class="btn" data-a="ruleSave">Save rule</button>');
};
H.ruleSave = function (d, b) { run(b, function () { return A('bonusRuleSave', { id: S.rid, name: v('rn'), type: v('rt'), value: v('rv') }).then(function (r) { closeModal(); toast(r.message); reload(); }); }); };
H.ruleUse = function (d, b) { run(b, function () { return A('bonusRuleUse', { id: d.id }).then(function (r) { toast(r.message); reload(); }); }); };
H.ruleDel = function (d) { ask('Delete this bonus rule?', 'Yes, delete', 'bad').then(function (y) { if (y) run(null, function () { return A('bonusRuleDelete', { id: d.id }).then(function (r) { toast(r.message); reload(); }); }); }); };
H.setSave = function (d, b) {
  var ch = {}; $$('[data-k]').forEach(function (e) { if (!e.disabled && String(e.value) !== String(e.getAttribute('data-o'))) ch[e.getAttribute('data-k')] = e.value; });
  if (!Object.keys(ch).length) { toast('No changes to save.'); return; }
  run(b, function () { return A('saveSettings', { changes: ch }).then(function (r) { toast(r.message); reload(); }); });
};
H.runMaint = function (d, b) { run(b, function () { return A('runMaintenance').then(function (r) { toast(r.message); }); }); };
H.remNow = function (d, b) { run(b, function () { return A('sendReminderNow').then(function (r) { toast(r.message); }); }); };

/* ======================= ADMIN: administrators / log / password ======================= */
PG.admins = function () {
  return A('listAdmins').then(function (d) {
    S.adl = d.list;
    main('<h2>Administrators</h2>' + (d.canEdit ? '<p><button class="btn" data-a="admForm">+ Add administrator</button></p>' : '<div class="msg w">Only the Owner admin can add or edit administrators.</div>') + '<div class="card">' + tbl(['ID', 'Name', 'Email', 'Mobile', 'Role', 'Status', 'Password set', ''], d.list.map(function (a) { return '<tr><td>' + esc(a.id) + '</td><td>' + esc(a.name) + '</td><td>' + esc(a.email) + '</td><td>' + esc(a.phone) + '</td><td>' + a.role + '</td><td>' + badge(a.status) + '</td><td>' + (a.hasPassword ? 'Yes' : 'No') + '</td><td>' + (d.canEdit ? '<button class="btn sm" data-a="admForm" data-id="' + esc(a.id) + '">Edit</button>' + (S.user && S.user.id !== a.id ? ' <button class="btn sm bad" data-a="admDel" data-id="' + esc(a.id) + '" data-n="' + esc(a.name) + '">Delete</button>' : '') : '') + '</td></tr>'; })) + '</div><div class="hint">Passwords are never visible. Use "Login code" to let someone set or reset their own password.</div>');
  });
};
H.admForm = function (d) {
  var a = d.id ? S.adl.filter(function (x) { return x.id === d.id; })[0] : {}; S.aid = d.id || '';
  modal(d.id ? 'Edit administrator' : 'Add administrator', '<div class="row"><div>' + fld('Name', '<input type="text" id="an" value="' + esc(a.name) + '">') + '</div><div>' + fld('Email', '<input type="text" id="ae2" value="' + esc(a.email) + '">') + '</div></div><div class="row"><div>' + fld('Mobile (10 digits, optional)', '<input type="text" id="ap" value="' + esc(a.phone) + '">') + '</div><div>' + fld('Role', '<select id="ar">' + opts([['ADMIN', 'Admin'], ['OWNER', 'Owner']], a.role || 'ADMIN') + '</select>') + '</div><div>' + fld('Status', '<select id="as2">' + opts([['Active', 'Active'], ['Inactive', 'Inactive']], a.status || 'Active') + '</select>') + '</div></div>', '<button class="btn gr" data-a="mclose">Cancel</button><button class="btn" data-a="admSave">Save</button>');
};
H.admSave = function (d, b) {
  run(b, function () {
    return A('saveAdmin', { id: S.aid, name: v('an'), email: v('ae2'), phone: v('ap'), role: v('ar'), status: v('as2') }).then(function (r) {
      toast(r.message); reload();
      if (r.code) showCode(r.name, r.code, r.hours, r.emailed); else closeModal();
    });
  });
};
H.admDel = function (d) {
  ask('Permanently delete administrator ' + d.n + ' (' + d.id + ')? They will no longer be able to sign in. This cannot be undone.', 'Yes, delete', 'bad').then(function (y) {
    if (y) run(null, function () { return A('deleteAdmin', { id: d.id }).then(function (r) { toast(r.message); reload(); }); });
  });
};

function showCode(name, code, hours, emailed) {
  modal('Login setup code',
    '<div class="msg i">Give this one-time code to <b>' + esc(name) + '</b>. On the login page they tap <b>Forgot password? / First-time sign in</b>, enter their email or mobile number and this code, and choose a password.</div>' +
    (emailed ? '<div class="msg o">The code was also emailed to their registered email address.</div>' : '<div class="msg w">No email was sent (no valid email on file, or mail failed). Share the code personally.</div>') +
    '<div style="text-align:center;margin:14px 0"><div style="font-size:32px;font-weight:800;letter-spacing:5px;color:var(--navy)">' + esc(code) + '</div><div class="hint">Valid for ' + hours + ' hours. Shown only once and works only once.</div></div>',
    '<button class="btn gr" data-a="mclose">Close</button><button class="btn" data-a="codeCopy" data-c="' + esc(code) + '">Copy code</button>', true);
}
H.codeCopy = function (d) { try { navigator.clipboard.writeText(d.c); toast('Copied.'); } catch (e) { toast('Could not copy. Please note the code.', true); } };
H.admCode = function (d, b) {
  run(b, function () { return A('issueCode', { kind: 'ADMIN', id: d.id }).then(function (r) { showCode(r.name, r.code, r.hours, r.emailed); }); });
};
H.empCode = function (d, b) {
  run(b, function () { return A('issueCode', { kind: 'EMPLOYEE', id: d.id }).then(function (r) { showCode(r.name, r.code, r.hours, r.emailed); }); });
};

PG.log = function () {
  var f = S.lf || {};
  main('<h2>System Log</h2><div class="card"><div class="bar"><div>' + fld('Search', '<input type="text" id="lq" value="' + esc(f.q || '') + '">') + '</div><div>' + fld('Module', '<select id="lmod">' + opts(['SECURITY', 'LEAVE', 'LEDGER', 'EMPLOYEE', 'ADMIN', 'SETTINGS', 'BONUS', 'UNAUTHORIZED', 'HOLIDAY', 'NOTIFICATION', 'SYSTEM'].map(function (x) { return [x, x]; }), f.module, 'All') + '</select>') + '</div><div><button class="btn" data-a="lGo">Search</button></div></div><div id="ll" class="ld">Loading...</div><div class="hint">Showing the latest 300 matching entries. The log is append-only through the application; administrators cannot edit or delete entries here.</div></div>');
  function logCards(l) {
    if (!l.length) return '<div class="ld">No log entries found.</div>';
    return '<div class="lg">' + l.map(function (r) {
      var bad = r.result !== 'SUCCESS';
      var who = r.user || r.role || 'SYSTEM';
      var rl = (r.user && r.role && r.user !== r.role) ? r.role : '';
      var det = '';
      if (r.oldV) det += '<div class="lg-d"><b>Old</b><span>' + esc(r.oldV) + '</span></div>';
      if (r.newV) det += '<div class="lg-d"><b>New</b><span>' + esc(r.newV) + '</span></div>';
      if (r.remarks) det += '<div class="lg-d"><b>Remarks</b><span>' + esc(r.remarks) + '</span></div>';
      return '<div class="lg-r' + (bad ? ' bad' : '') + '"><div class="lg-h"><span class="lg-a">' + esc(r.action).replace(/_/g, '_<wbr>') + '</span><span class="lg-s ' + (bad ? 'bad' : 'ok') + '">' + esc(r.result) + '</span></div>' +
        '<div class="lg-m"><span>' + esc(r.at) + '</span><span>' + esc(who) + (rl ? ' <i>' + esc(rl) + '</i>' : '') + '</span><span>' + esc(r.module) + '</span>' + (r.rec ? '<span>ID: ' + esc(r.rec) + '</span>' : '') + '</div>' + det + '</div>';
    }).join('') + '</div>';
  }
  return A('listLog', f).then(function (l) { var el = $('#ll'); if (!el) return; el.className = ''; el.innerHTML = logCards(l); });
};
H.lGo = function () { S.lf = { q: v('lq'), module: v('lmod') }; reload(); };
PG.pwd = function () {
  main('<h2>Change Password</h2><div class="card" style="max-width:420px"><div data-enter="pwSave">' + fld('Current password', '<input type="password" id="pc" autocomplete="current-password">') + fld('New password', '<input type="password" id="pn" autocomplete="new-password">', 'Minimum 8 characters with letters and numbers.') + fld('Confirm new password', '<input type="password" id="pf" autocomplete="new-password">') + '<p><button class="btn" data-a="pwSave">Change password</button></p><div class="hint">All sessions (including this one) are signed out after a change.</div></div></div>');
};
H.pwSave = function (d, b) { run(b, function () { return A('changePassword', { currentPassword: v('pc'), newPassword: v('pn'), confirmPassword: v('pf') }).then(function (r) { signOut(r.message); }); }); };



/* ---------- boot ---------- */
setTimeout(function () {   // decorative font loads after the page is already visible
  try { var fl = document.createElement('link'); fl.rel = 'stylesheet'; fl.href = 'https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap'; document.head.appendChild(fl); } catch (e) { }
}, 50);
(function () {
  var st = null; try { st = JSON.parse(sessionStorage.getItem('kl') || 'null'); } catch (e) { }
  if (st && st.token && st.role) {
    S.role = st.role; S.token = st.token; S.user = st.user; S.cfg = st.cfg || {}; $('#boot').style.display = 'none'; shell();
    if (S.role === 'adm') A('listEmployees').then(function (l) { S.emps = l; }).catch(function () { });
    H.go({ p: S.role === 'emp' ? 'home' : 'dash' });

  } else { login(); raw('pub', 'getPublicInfo').catch(function () { }); }
})();
})();
</script>
